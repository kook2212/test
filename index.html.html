<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HA Citrix 模擬測試工具</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; padding: 40px; background-color: #f0f2f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .test-block { margin-bottom: 30px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; }
        .btn { display: inline-block; padding: 12px 24px; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; margin-top: 10px; }
        .btn-blue { background-color: #0078d4; }
        .btn-blue:hover { background-color: #0063b1; }
        .btn-green { background-color: #107c10; }
        .btn-green:hover { background-color: #0b5a0b; }
        .status { margin-top: 10px; font-size: 0.9em; color: #666; }
        .note { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏥 HA Citrix 模擬測試工具</h1>
    
    <div class="note">
        <strong>⚠️ 重要：</strong> 請勿直接雙擊此檔案開啟。請將此檔案放入 IIS，或使用 Python <code>python -m http.server</code> 啟動，以模擬真實網站行為。
    </div>

    <!-- 測試 1: 模擬 ICA 檔案下載 (最常見的 HA 模式) -->
    <div class="test-block">
        <h3>測試 A：模擬 ICA 檔案下載 (最常見模式)</h3>
        <p>這是模擬 HA 系統生成一個 <code>.ica</code> 檔案並傳送給瀏覽器的過程。</p>
        <p><strong>預期結果：</strong> 瀏覽器應該要自動下載並<b>自動彈出</b> Citrix 視窗（顯示錯誤沒關係，重點是有彈出）。</p>
        <button id="downloadBtn" class="btn btn-green" onclick="downloadICA()">模擬下載 ICA 檔案</button>
        <div id="msgA" class="status"></div>
    </div>

    <!-- 測試 2: 模擬 Protocol Handler -->
    <div class="test-block">
        <h3>測試 B：模擬 Protocol 呼叫 (新版模式)</h3>
        <p>這是模擬瀏覽器直接呼叫應用程式。</p>
        <p><strong>預期結果：</strong> 瀏覽器不應詢問，直接彈出 Citrix。</p>
        <a href="citrixreceiver://test_probe" class="btn btn-blue" onclick="document.getElementById('msgB').innerText='已發送呼叫請求...'">測試 Protocol 啟動</a>
        <div id="msgB" class="status"></div>
    </div>
</div>

<script>
    function downloadICA() {
        // 1. 建立一個假的 ICA 檔案內容
        const icaContent = `[Encoding]\nInputEncoding=UTF8\n\n[WFClient]\nVersion=2\nClientName=TestStation\n\n[ApplicationServers]\nTestApp=\n\n[TestApp]\nAddress=127.0.0.1\nInitialProgram=#TestApp`;
        
        // 2. 建立 Blob 物件，強制設定 MIME type 為 application/x-ica
        // 這就是告訴瀏覽器「這是一個 Citrix 檔案」的關鍵
        const blob = new Blob([icaContent], { type: 'application/x-ica' });
        const url = window.URL.createObjectURL(blob);
        
        // 3. 建立虛擬下載連結並點擊
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = 'simulation_test.ica'; // 設定檔名
        
        document.body.appendChild(a);
        a.click();
        
        // 清理
        window.URL.revokeObjectURL(url);
        document.getElementById('msgA').innerText = '已觸發下載，請觀察瀏覽器是否自動開啟檔案...';
    }
</script>

</body>
</html>
